name: CI EventFlow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate static application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify required files
        run: |
          test -f index.html
          test -f README.md
          test -f infra/main.tf
      - name: Verify EventFlow title
        run: grep -q '<title>EventFlow - Venta de Entradas</title>' index.html
